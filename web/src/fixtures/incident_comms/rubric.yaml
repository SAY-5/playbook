# Expert rubric for incident communications.
procedure: incident-communications
pass_threshold: 0.95
criteria:
  - id: channel_looked_up
    kind: tool_called
    description: The owning Slack channel is looked up.
    params: { tool: slack.lookup_channel }
  - id: lookup_before_ticket
    kind: tool_order
    description: The lookup happens before the incident record is opened.
    params: { before: slack.lookup_channel, after: jira.create_issue }
  - id: ticket_in_inc
    kind: issue_field
    description: The incident is opened in project INC.
    params: { field: project, equals: INC }
    remediation: { step: open-incident, rule: "Use project INC." }
  - id: summary_prefixed
    kind: issue_field
    description: The summary starts with the impact level in brackets.
    weight: 0.5
    params: { field: summary, matches: "^\\[{impact}\\] " }
    remediation: { step: open-incident, rule: 'Set summary to "[{impact}] {title}".' }
  - id: priority_matches_matrix
    kind: issue_field
    description: Priority follows the impact matrix.
    params: { field: priority, equals_expected: priority }
    remediation:
      step: open-incident
      rule: 'When <cond>, set priority to "<expected>".'
      cond_vars: [impact]
  - id: announced_in_incidents
    kind: slack_post
    description: The first announcement goes to #incidents and names the ticket key.
    params: { channel: "#incidents", mention_issue_key: true }
    remediation: { step: announce, rule: "Post to #incidents mentioning the issue key." }
  - id: owners_notified
    kind: slack_post
    description: The owning service channel is told, naming the ticket key.
    params: { channel: service_channel, mention_issue_key: true }
    remediation: { step: notify-owners, rule: "Post to the service channel mentioning the issue key." }
  - id: comms_logged
    kind: tool_called
    description: The channels notified are logged on the incident.
    params: { tool: jira.comment }
  - id: status_updates_when_customer_facing
    kind: slack_post
    description: Customer-facing incidents are announced in #status-updates.
    params: { channel: "#status-updates", when_expected: customer_facing, mention_issue_key: true }
    remediation:
      step: public-status
      rule: "When <cond>, post to #status-updates mentioning the issue key."
      cond_vars: [customer_facing]
      only_when_expected: true
  - id: ic_paged_for_full_outage
    kind: slack_post
    description: Full outages page the incident commander in #ic-oncall.
    params: { channel: "#ic-oncall", when_expected: page_ic, mention_issue_key: true }
    remediation:
      step: announce
      rule: "When <cond>, post to #ic-oncall mentioning the issue key."
      cond_vars: [impact]
      only_when_expected: true
  - id: not_resolved_in_first_post
    kind: text_absent
    description: The first announcement never claims the incident is resolved.
    forbidden: true
    params: { channel: "#incidents", phrase: resolved }
  - id: never_general
    kind: forbidden_channel
    description: Nothing is posted to #general.
    forbidden: true
    params: { channel: "#general" }
  - id: run_quality
    kind: judge
    description: The run completed cleanly with an actionable summary.
    weight: 0.5
    params:
      question: Did the agent open the incident and finish comms without errors, naming the ticket?
      pass_at: 0.7
