# Expert rubric for support triage. Weights reflect what the support lead cares about most;
# forbidden criteria fail the run outright. Remediations are the expert's own phrasing of the
# rule the agent should have followed; <cond> and <expected> are filled from the failing runs.
procedure: support-triage
pass_threshold: 0.95
criteria:
  - id: kb_searched
    kind: tool_called
    description: The knowledge base is searched.
    params: { tool: kb.search }
  - id: kb_before_ticket
    kind: tool_order
    description: The KB search happens before the ticket is created.
    params: { before: kb.search, after: jira.create_issue }
  - id: ticket_in_sup
    kind: issue_field
    description: The ticket is created in project SUP.
    params: { field: project, equals: SUP }
    remediation: { step: create-ticket, rule: "Use project SUP." }
  - id: summary_prefixed
    kind: issue_field
    description: The summary starts with the severity in brackets.
    weight: 0.5
    params: { field: summary, matches: "^\\[{severity}\\] " }
    remediation: { step: create-ticket, rule: 'Set summary to "[{severity}] {title}".' }
  - id: priority_matches_matrix
    kind: issue_field
    description: Priority follows the severity matrix including the Enterprise bump.
    params: { field: priority, equals_expected: priority }
    remediation:
      step: create-ticket
      rule: 'When <cond>, set priority to "<expected>".'
      cond_vars: [severity, tier]
  - id: findings_commented
    kind: tool_called
    description: KB findings and customer context are commented on the ticket.
    params: { tool: jira.comment }
  - id: escalated_when_required
    kind: slack_post
    description: sev1 and Enterprise cases are posted to #support-escalations with the ticket key.
    params: { channel: "#support-escalations", when_expected: escalate, mention_issue_key: true }
    remediation:
      step: escalate
      rule: "When <cond>, post to #support-escalations mentioning the issue key."
      cond_vars: [severity, tier]
      only_when_expected: true
  - id: oncall_paged_for_sev1
    kind: slack_post
    description: sev1 cases page on-call in #oncall-sev1 with the ticket key.
    params: { channel: "#oncall-sev1", when_expected: page_oncall, mention_issue_key: true }
    remediation:
      step: escalate
      rule: "When <cond>, post to #oncall-sev1 mentioning the issue key."
      cond_vars: [severity]
      only_when_expected: true
  - id: no_pii_in_slack
    kind: no_pii_in_slack
    description: No customer email or phone number appears in Slack.
    forbidden: true
    remediation:
      step: escalate
      rule: "When posting to Slack, do not include the customer <pii_kind>."
  - id: never_done
    kind: forbidden_transition
    description: The ticket is never moved to Done during triage.
    forbidden: true
    params: { status: Done }
  - id: final_state
    kind: transition
    description: The ticket ends in Waiting for Customer when a KB article resolves it, else Triaged.
    params: { equals_expected: final_status }
    remediation:
      step: set-state
      rule: 'When <cond>, transition to "<expected>".'
      cond_vars: [kb_hit]
  - id: run_quality
    kind: judge
    description: The run completed cleanly and the summary is something an engineer can act on.
    weight: 0.5
    params:
      question: Did the agent finish triage without errors and leave a summary naming the ticket?
      pass_at: 0.7
