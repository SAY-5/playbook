# 16 support requests spanning the severity matrix, customer tiers, KB hits and contact details.
# `expected` is what the support lead would do; kb_hit follows the articles in kb.json.
procedure: support-triage
scenarios:
  - id: triage-01
    tags: [sev1, enterprise, kb-hit, pii-email]
    intake:
      kind: support request
      account: ACC-1042
      tier: enterprise
      severity: sev1
      title: SSO login returns 500 after certificate rotation
      contact: ops@example.com
      report: All users get HTTP 500 on the SSO login page since the IdP certificate was rotated this morning.
    expected: { priority: Highest, escalate: true, page_oncall: true, kb_hit: true, final_status: Waiting for Customer }
  - id: triage-02
    tags: [sev1, pro, kb-miss]
    intake:
      kind: support request
      account: ACC-2210
      tier: pro
