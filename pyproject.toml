[project]
name = "playbook"
version = "5.0.0"
description = "Expert SOP to deployed tool-calling agent with rubric evals and a prompt feedback loop"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "SAY-5", email = "say.apm35@gmail.com" }]
dependencies = [
  "anthropic>=0.40",
  "boto3>=1.34",
  "click>=8.1",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.scripts]
playbook = "playbook.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["playbook", "fakes"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
timeout = 120
